name: Feature Request
description: Suggest an idea or enhancement for HaulDesk.
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting improvements to HaulDesk!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of the friction or limitation you encounter.
      placeholder: I find it tedious when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or workarounds you've thought of.
  - type: dropdown
    id: agent
    attributes:
      label: Relevant Shopping Agent / Platform
      description: If this involves an agent integration, which one?
      options:
        - Superbuy
        - CSSBuy
        - Sugargoo
        - Mulebuy
        - AllChinaBuy
        - General / Not Agent Specific
