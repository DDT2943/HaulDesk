name: Bug Report
description: Create a report to help us fix an issue or defect in HaulDesk.
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible.
  - type: input
    id: version
    attributes:
      label: HaulDesk Version / Commit
      description: What version of HaulDesk are you running? (e.g. v1.0.0, Docker image, or commit hash)
      placeholder: v1.0.0
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Operating System / Environment
      options:
        - Windows 10/11 (Standalone)
        - macOS Apple Silicon (arm64)
        - macOS Intel (x64)
        - Linux (Ubuntu/Debian/Arch/Fedora)
        - Docker / Docker Compose
        - Firefox Browser Extension (.xpi)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: When I paste a Yupoo link...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      value: |
        1. Open order '...'
        2. Click on '...'
        3. Observe error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console or Terminal Logs
      description: Paste any error messages from the terminal or browser Developer Tools (F12).
      render: shell
