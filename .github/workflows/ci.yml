name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        node-version: [ 22.x ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Remove stale lockfile if present
        run: |
          node -e "require('node:fs').rmSync('package-lock.json', { force: true })"

      - name: Install dependencies
        run: npm install --include=optional --legacy-peer-deps

      - name: Typecheck
        run: npm run lint

      - name: Run unit test suite
        run: npm test

      - name: Build web frontend, extension & server bundle
        run: npm run electron:prepare

      - name: Verify unpacked desktop bundle (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --x64 --dir --publish never
