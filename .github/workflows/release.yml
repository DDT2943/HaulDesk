name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  verify:
    name: Verify Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Remove stale lockfile if present
        run: |
          node -e "require('node:fs').rmSync('package-lock.json', { force: true })"

      - name: Install dependencies
        run: npm install --include=optional --legacy-peer-deps

      - name: Typecheck
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build Firefox extension (.xpi)
        run: npm run pack:extension

      - name: Upload Firefox extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: firefox-extension
          path: dist-extension/hauldesk-quickadd.xpi

  build-desktop:
    name: Build Standalone App (${{ matrix.label }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            script: npm run electron:build:win
            artifact_name: desktop-windows-x64
          - label: macOS Apple Silicon (arm64)
            os: macos-latest
            script: npm run electron:build:mac:arm64
            artifact_name: desktop-macos-arm64
          - label: macOS Intel (x64)
            os: macos-15-intel
            script: npm run electron:build:mac:x64
            artifact_name: desktop-macos-x64
          - label: Linux x64
            os: ubuntu-latest
            script: npm run electron:build:linux
            artifact_name: desktop-linux-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Remove stale lockfile if present
        run: |
          node -e "require('node:fs').rmSync('package-lock.json', { force: true })"

      - name: Install dependencies
        run: npm install --include=optional --legacy-peer-deps

      - name: Build standalone Electron packages
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: ${{ matrix.script }}

      - name: Upload built installers & packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: |
            release-desktop/*.exe
            release-desktop/*.dmg
            release-desktop/*.zip
            release-desktop/*.AppImage
            release-desktop/*.deb

  publish-release:
    name: Publish GitHub Release
    needs: [verify, build-desktop]
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release-artifacts
        run: |
          rm -f checksums.txt
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: HaulDesk ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/*
